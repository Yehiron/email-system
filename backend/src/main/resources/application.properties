spring.application.name=email-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
spring.servlet.multipart.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.username=${APP_USERNAME:alumno}
app.password=${APP_PASSWORD:local-learning-only}
app.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.email.mode=${EMAIL_MODE:simulation}
app.worker.url=${WORKER_URL:http://localhost:8787/api/send-email}
app.worker.token=${WORKER_TOKEN:}
