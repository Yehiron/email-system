[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist/email-frontend/browser"
[build.environment]
  NODE_VERSION = "22"
# Antes de publicar, reemplaza api.example.com por el dominio HTTPS real de Spring Boot.
[[redirects]]
  from = "/api/*"
  to = "https://api.example.com/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
